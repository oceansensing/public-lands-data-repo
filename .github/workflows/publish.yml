# Publish this repository's products: fetch with the site's pipelines,
# validate against the site's contract, and publish one build to GitHub Pages
# and to Cloudflare R2. Written by the site's pipeline/scaffold/new-origin.py
# from the sibling data repositories' workflow.
#
# **Dispatch-only until a dispatched run has published a tree**: prove the
# pipeline, THEN uncomment the schedule below, in the same commit as the docs.
# `status/status.json` reports `schedule: null` until then, and the site's
# watchdog names an origin with no schedule on sight.
#
# Needs, from the owner: `PIPELINES_SSH_KEY` (this repository's read-only
# deploy key on oceansensing.github.io) and the organization's R2_* secrets.

name: Publish

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the probe says the tree is current'
        type: boolean
        default: false
  schedule:
    - cron: '41 7 * * *'

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # **The land's tiles are built where they are big** (2026-10-20): PAD-US state by state across
  # a job matrix before the build, which joins the groups' tiles; the Forest Service's routes in
  # the build itself. Each product's tiles are carried from run to run by this repository's
  # cache, under the version its root (on the `published` branch) names — never committed.
  plan-lands:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      padus-build: ${{ steps.need.outputs.build }}
      padus-groups: ${{ steps.padus.outputs.groups }}
      padus-version: ${{ steps.padus.outputs.version }}
      usfs-version: ${{ steps.usfs.outputs.version }}
    steps:
      - name: Check out the pipelines
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oceansensing/oceansensing.github.io
          ref: main
          path: site
          sparse-checkout: scripts
          ssh-key: ${{ secrets.PIPELINES_SSH_KEY }}
      - name: Check out the last publish
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: published
          path: published
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # The service's identity against the last publish's: whether the matrix builds.
      - name: Ask the PAD-US service what it holds
        id: padus
        run: python3 site/scripts/fetch-padus.py --plan --published published/map ${{ inputs.force && '--force' || '' }}
      - name: Is the published PAD-US set in the cache
        id: cached
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/padus
          key: lands-padus-${{ steps.padus.outputs.version }}
          lookup-only: true
      - name: Decide
        id: need
        run: echo "build=${{ steps.padus.outputs.build == 'true' || steps.cached.outputs.cache-hit != 'true' }}" >> "$GITHUB_OUTPUT"
      - name: The routes' published version
        id: usfs
        run: |
          v=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('version') or 'none')" published/map/usfs-routes.json 2>/dev/null || echo none)
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # One job a group of states (fetch-padus.py's GROUPS): the group's Fee and Easement land
  # fetched from the service and tiled, zooms 4 to 12, handed on as an artifact for a day.
  padus-part:
    needs: plan-lands
    if: needs.plan-lands.outputs.padus-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ${{ fromJSON(needs.plan-lands.outputs.padus-groups) }}
    steps:
      - name: Check out the pipelines
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oceansensing/oceansensing.github.io
          ref: main
          path: site
          sparse-checkout: scripts
          ssh-key: ${{ secrets.PIPELINES_SSH_KEY }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install what the fetchers need
        run: pip install --no-cache-dir -r site/scripts/requirements-lands.txt
      - name: Tile the group's land
        run: python3 site/scripts/fetch-padus.py --part ${{ matrix.group }} --out parts
      - name: Hand on the group's tiles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: padus-part-${{ matrix.group }}
          path: parts
          retention-days: 1

  build:
    needs: [plan-lands, padus-part]
    if: always() && needs.plan-lands.result == 'success' && needs.padus-part.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.run.outputs.deploy }}
      behind: ${{ steps.run.outputs.behind }}
    steps:
      # This repository first: actions/checkout cleans its destination, so
      # taking the root after the others would wipe them.
      - name: Check out this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the pipelines
        id: pipelines
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oceansensing/oceansensing.github.io
          ref: main
          path: site
          ssh-key: ${{ secrets.PIPELINES_SSH_KEY }}
      - name: Say why the pipelines could not be checked out
        if: failure() && steps.pipelines.outcome == 'failure'
        run: |
          echo "::error title=Cannot read the pipelines::Could not check out oceansensing/oceansensing.github.io. Read the step log first - the causes look alike."
          echo "::error title=If the log says 'error in libcrypto'::The key could not be PARSED - almost always a missing trailing newline on PIPELINES_SSH_KEY. Re-paste the whole file (pbcopy < keyfile), or set it with gh secret set < keyfile."
          echo "::error title=If the log says only 'Permission denied (publickey)'::The public half is missing from the site repository's Deploy keys page, was revoked, or does not match."
          echo "::error title=If the log says 'Repository not found'::The secret is unset or empty, so the checkout fell back to GITHUB_TOKEN, which holds no grant on the site repository."
      - name: Check out the last publish
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: published
          path: published
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install what the fetchers need
        run: pip install --no-cache-dir -r site/scripts/requirements-lands.txt
      - name: Unit-test the orchestrator
        working-directory: site
        run: python3 pipeline/test_orchestrate.py
      - name: Self-test mvt.py
        run: python3 site/scripts/mvt.py --self-test
      - name: Self-test land_tiles.py
        run: python3 site/scripts/land_tiles.py --self-test
      - name: Self-test fetch-padus.py
        run: python3 site/scripts/fetch-padus.py --self-test
      - name: Self-test fetch-usfs-routes.py
        run: python3 site/scripts/fetch-usfs-routes.py --self-test
      - name: Seed the stage from the last publish
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
        run: python3 site/pipeline/orchestrate.py seed
      # Each product's tiles as last published, from the cache, under the version its root names.
      - name: Restore PAD-US's tiles
        id: padus-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/padus
          key: lands-padus-${{ needs.plan-lands.outputs.padus-version }}
      - name: Restore the routes' tiles
        id: usfs-tiles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/usfs-routes
          key: lands-usfs-routes-${{ needs.plan-lands.outputs.usfs-version }}
      - name: Download PAD-US's groups
        if: needs.plan-lands.outputs.padus-build == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: padus-part-*
          path: parts
          merge-multiple: true
      - name: Plan the run
        id: plan
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
        run: python3 site/pipeline/orchestrate.py plan --mode full
      - name: Fetch, validate, assemble
        id: run
        env:
          PIPELINE_ROOT: ${{ github.workspace }}
          PADUS_PARTS: ${{ github.workspace }}/parts
          PIPELINE_DUE_NOW: ${{ steps.usfs-tiles.outputs.cache-hit != 'true' && 'usfs-routes' || '' }}
        run: python3 site/pipeline/orchestrate.py run
      # A set this run built is saved under its own version, for the next run to restore.
      # And so is a set its restore missed: else every run after the cache was evicted would miss it
      # again and build it again.
      - name: Name the sets on the stage
        id: sets
        if: always()
        run: |
          for p in padus usfs-routes; do
            v=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('version') or 'none')" site/public/map/land/$p/index.json 2>/dev/null || echo none)
            echo "${p%%-*}=$v" >> "$GITHUB_OUTPUT"
          done
      - name: Save PAD-US's tiles
        if: steps.run.outputs.deploy == 'true' && steps.sets.outputs.padus != 'none' && (steps.sets.outputs.padus != needs.plan-lands.outputs.padus-version || steps.padus-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/padus
          key: lands-padus-${{ steps.sets.outputs.padus }}
      - name: Save the routes' tiles
        if: steps.run.outputs.deploy == 'true' && steps.sets.outputs.usfs != 'none' && (steps.sets.outputs.usfs != needs.plan-lands.outputs.usfs-version || steps.usfs-tiles.outputs.cache-hit != 'true')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/public/map/land/usfs-routes
          key: lands-usfs-routes-${{ steps.sets.outputs.usfs }}
      - name: Upload the site
        if: steps.run.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out
      # What this origin publishes to R2 alone (the site pipeline's D13, its
      # note of 2026-10-09), and R2's whole status: the R2 job lays it beside
      # the site. Public for the day it is kept, so open data only.
      - name: Hand on what R2 alone carries
        if: steps.run.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r2-only
          path: out-r2
          retention-days: 1
      - name: Upload the branch content
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: branch-out
          path: branch-out
          retention-days: 1

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download the branch content
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: branch-out
          path: branch-out
      - name: Publish the branch
        run: |
          cd branch-out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "publish $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:published
      - name: Configure Pages
        if: needs.build.outputs.deploy == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        if: needs.build.outputs.deploy == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # R2 stands on its own (the site's pipeline D12): beside the Pages deploy,
  # not after it, and neither side's failure stops the other.
  publish-r2:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Check out the publish script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oceansensing/oceansensing.github.io
          path: code
          sparse-checkout: pipeline
          ssh-key: ${{ secrets.PIPELINES_SSH_KEY }}
      - name: Download the built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: pages
      - name: Download what R2 alone carries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: r2-only
          path: r2-only
      - name: Test the publish script
        run: python3 code/pipeline/test_publish_r2.py
      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          mkdir site
          tar -xf pages/artifact.tar -C site
          python3 code/pipeline/publish_r2.py site "$GITHUB_REPOSITORY" --with r2-only
